<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" role="img" aria-labelledby="title desc">
  <title id="title">Kifaru cross-institution fraud signal</title>
  <desc id="desc">A protected fraud fingerprint moves between financial institutions and stops a suspicious payment path.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071c38"/>
      <stop offset=".55" stop-color="#0b3973"/>
      <stop offset="1" stop-color="#1255a6"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#8ab4f8" stop-opacity=".65"/>
      <stop offset="1" stop-color="#8ab4f8" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#00152f" flood-opacity=".42"/>
    </filter>
    <pattern id="grid" width="72" height="72" patternUnits="userSpaceOnUse">
      <path d="M72 0H0V72" fill="none" stroke="#b7d3ff" stroke-opacity=".08"/>
    </pattern>
  </defs>

  <rect width="1600" height="1200" fill="url(#bg)"/>
  <rect width="1600" height="1200" fill="url(#grid)"/>
  <circle cx="830" cy="490" r="470" fill="url(#glow)" opacity=".48"/>

  <g fill="none" stroke="#9fc5ff" stroke-opacity=".18">
    <circle cx="820" cy="500" r="350"/>
    <circle cx="820" cy="500" r="470"/>
    <path d="M75 910C360 690 530 850 800 620s490-255 740-90"/>
    <path d="M-20 300C250 480 520 260 760 370s450 300 860 80"/>
  </g>

  <g filter="url(#shadow)">
    <g transform="translate(130 250)">
      <rect width="330" height="190" rx="30" fill="#fff" fill-opacity=".95"/>
      <rect x="34" y="34" width="60" height="60" rx="18" fill="#d3e3fd"/>
      <path d="M47 77h34M52 77V58l12-8 12 8v19M45 82h38" fill="none" stroke="#0b57d0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="120" y="42" width="142" height="18" rx="9" fill="#1f1f1f"/>
      <rect x="120" y="76" width="100" height="12" rx="6" fill="#747775"/>
      <rect x="34" y="128" width="245" height="18" rx="9" fill="#d3e3fd"/>
    </g>

    <g transform="translate(1110 710)">
      <rect width="350" height="200" rx="30" fill="#fff" fill-opacity=".95"/>
      <rect x="34" y="34" width="60" height="60" rx="18" fill="#d3e3fd"/>
      <path d="M64 49 82 57v15c0 15-8 23-18 28-10-5-18-13-18-28V57l18-8Z" fill="none" stroke="#0b57d0" stroke-width="6" stroke-linejoin="round"/>
      <rect x="120" y="42" width="160" height="18" rx="9" fill="#1f1f1f"/>
      <rect x="120" y="76" width="116" height="12" rx="6" fill="#747775"/>
      <rect x="34" y="134" width="270" height="18" rx="9" fill="#d3e3fd"/>
    </g>

    <g transform="translate(635 365)">
      <rect width="370" height="255" rx="42" fill="#0b57d0"/>
      <circle cx="185" cy="99" r="54" fill="#fff" fill-opacity=".16"/>
      <path d="M185 55 222 70v28c0 31-16 51-37 62-21-11-37-31-37-62V70l37-15Z" fill="#fff" fill-opacity=".95"/>
      <path d="m165 103 14 14 28-34" fill="none" stroke="#0b57d0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="84" y="184" width="202" height="20" rx="10" fill="#fff" fill-opacity=".9"/>
      <rect x="120" y="220" width="130" height="12" rx="6" fill="#fff" fill-opacity=".4"/>
    </g>
  </g>

  <path d="M460 345C585 335 603 395 666 435" fill="none" stroke="#8ab4f8" stroke-width="14" stroke-linecap="round"/>
  <path d="M979 581C1050 640 1070 713 1120 760" fill="none" stroke="#8ab4f8" stroke-width="14" stroke-linecap="round"/>
  <path d="M456 345C620 570 890 705 1125 760" fill="none" stroke="#ff735c" stroke-width="7" stroke-linecap="round" stroke-dasharray="4 23"/>

  <g>
    <circle cx="530" cy="397" r="20" fill="#8ab4f8"/>
    <circle cx="1055" cy="683" r="20" fill="#8ab4f8"/>
    <circle cx="870" cy="613" r="25" fill="#ff735c"/>
    <circle cx="870" cy="613" r="55" fill="#ff735c" opacity=".18" filter="url(#blur)"/>
  </g>

  <g transform="translate(830 580)">
    <circle cx="40" cy="33" r="40" fill="#fff"/>
    <path d="m22 34 12 12 25-29" fill="none" stroke="#146c2e" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
