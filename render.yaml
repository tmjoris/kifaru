services:
  - type: web
    name: kifaru-api
    runtime: go
    plan: free
    autoDeployTrigger: commit
    rootDir: backend
    buildCommand: mkdir -p bin && go build -o bin/kifaru-api .
    startCommand: ./bin/kifaru-api
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: FRONTEND_ORIGIN
        value: https://kifarulive.onrender.com

  - type: web
    name: kifaru-demo-banks
    runtime: go
    plan: free
    autoDeployTrigger: commit
    rootDir: demo-banks
    buildCommand: mkdir -p bin && go build -o bin/demo-banks .
    startCommand: ./bin/demo-banks hosted
    healthCheckPath: /demo-banks/api/state
    envVars:
      - key: KIFARU_API_URL
        value: https://kifaru-api.onrender.com
      - key: KIFARU_WEB_URL
        value: https://kifarulive.onrender.com

  - type: web
    name: kifarulive
    runtime: static
    autoDeployTrigger: commit
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: kifaru-api
          property: host
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
